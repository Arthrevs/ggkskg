name: 🐍 Backend – Python CI

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - '**.py'
      - 'requirements.txt'
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - '**.py'
      - 'requirements.txt'
      - 'backend/**'
      - '.github/workflows/backend.yml'

permissions:
  contents: read

jobs:
  backend-check:
    name: Lint, Security & Version Lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"    # locked version – prevents version clash

      - name: Verify Python version
        run: |
          echo "🐍 Python version:"
          python --version
          echo "📦 Pip version:"
          pip --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 bandit
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi

      - name: Lint – syntax errors & undefined names
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Security scan (Bandit)
        run: |
          echo "🔒 Scanning Python code for security issues..."
          bandit -r . -ll -ii --skip B101 \
            --exclude ./.git,./node_modules,./.venv,./venv || true

      - name: Check for hardcoded secrets in Python
        run: |
          echo "🔑 Checking Python files for hardcoded credentials..."
          FOUND=0
          if grep -rEnI --include="*.py" \
            '(api_key|secret_key|password|token|auth)\s*=\s*["\x27][A-Za-z0-9+/=_-]{8,}' \
            --exclude-dir=node_modules --exclude-dir=.git \
            --exclude-dir=venv --exclude-dir=.venv \
            . 2>/dev/null; then
            echo "⚠️  Possible hardcoded credentials found in Python files!"
            FOUND=1
          fi
          if [ "$FOUND" -eq 1 ]; then
            echo "❌ Use environment variables or .env files instead."
            exit 1
          fi
          echo "✅ No hardcoded credentials in Python files."

      - name: Dependency version conflict check
        run: |
          echo "📦 Checking for dependency version conflicts..."
          pip check
          echo "✅ No dependency conflicts found."
