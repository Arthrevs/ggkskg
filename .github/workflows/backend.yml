name: 🐍 Backend – Python CI

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - '**.py'
      - 'requirements.txt'
      - 'pyproject.toml'
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - '**.py'
      - 'requirements.txt'
      - 'pyproject.toml'
      - 'backend/**'
      - '.github/workflows/backend.yml'

permissions:
  contents: read

# ─────────────────────────────────────────────
# Pipeline:
#   install → lint/security/secrets
#                ├── format check (black)
#                ├── type check (mypy)
#                ├── tests (pytest)
#                └── import verification
# ─────────────────────────────────────────────

jobs:
  # ───── Job 1: Core Checks (Lint, Security, Secrets) ─────
  backend-check:
    name: Lint, Security & Secrets
    runs-on: ubuntu-latest
    outputs:
      backend-dir: ${{ steps.detect.outputs.dir }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"    # 🔒 pinned version – prevents version clash

      - name: Verify Python version
        run: |
          echo "🐍 Python version:"
          python --version
          echo "📦 Pip version:"
          pip --version

      - name: Detect backend directory
        id: detect
        run: |
          if [ -f backend/requirements.txt ] || [ -f backend/pyproject.toml ]; then
            echo "dir=backend" >> $GITHUB_OUTPUT
          elif [ -f requirements.txt ] || [ -f pyproject.toml ]; then
            echo "dir=." >> $GITHUB_OUTPUT
          else
            echo "dir=." >> $GITHUB_OUTPUT
            echo "ℹ️ No requirements file found – will still run checks on .py files."
          fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 bandit black mypy pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install -e ".[dev]" 2>/dev/null || true; fi
          if [ -f backend/pyproject.toml ]; then pip install -e "backend/.[dev]" 2>/dev/null || true; fi

      - name: Lint – syntax errors & undefined names (strict)
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Lint – style warnings (advisory)
        run: |
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Security scan (Bandit)
        run: |
          echo "🔒 Scanning Python code for security issues..."
          bandit -r . -ll -ii --skip B101 \
            --exclude ./.git,./node_modules,./.venv,./venv || true

      - name: Check for hardcoded secrets in Python
        run: |
          echo "🔑 Checking Python files for hardcoded credentials..."
          FOUND=0
          if grep -rEnI --include="*.py" \
            '(api_key|secret_key|password|token|auth)\s*=\s*["\x27][A-Za-z0-9+/=_-]{8,}' \
            --exclude-dir=node_modules --exclude-dir=.git \
            --exclude-dir=venv --exclude-dir=.venv \
            . 2>/dev/null; then
            echo "⚠️  Possible hardcoded credentials found in Python files!"
            FOUND=1
          fi
          if [ "$FOUND" -eq 1 ]; then
            echo "❌ Use environment variables or .env files instead."
            exit 1
          fi
          echo "✅ No hardcoded credentials in Python files."

      - name: Dependency version conflict check
        run: |
          echo "📦 Checking for dependency version conflicts..."
          pip check
          echo "✅ No dependency conflicts found."

  # ───── Job 2: Format Check (Black) ─────
  backend-format:
    name: Black Format Check
    needs: backend-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Black
        run: pip install black

      - name: Check formatting
        run: |
          echo "🎨 Checking Python code formatting with Black..."
          black --check --diff . \
            --exclude '/(\.git|\.venv|venv|node_modules|__pycache__|dist|build)/' \
            2>&1 || {
              echo ""
              echo "❌ Code is not formatted. Run 'black .' locally to fix."
              exit 1
            }
          echo "✅ All Python files are properly formatted."

  # ───── Job 3: Type Check (mypy) ─────
  backend-typecheck:
    name: Mypy Type Check
    needs: backend-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mypy
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi

      - name: Run mypy
        run: |
          echo "🔍 Running mypy type checker..."
          # Use --ignore-missing-imports for gradual adoption
          mypy . --ignore-missing-imports \
            --exclude '(\.git|\.venv|venv|node_modules|__pycache__)' \
            || {
              echo ""
              echo "⚠️ Type errors found. Fix them or add type: ignore comments for known issues."
              exit 1
            }
          echo "✅ Type check passed."

  # ───── Job 4: Tests (pytest) ─────
  backend-test:
    name: Pytest
    needs: backend-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi

      - name: Check for tests
        id: has-tests
        run: |
          if find . -name 'test_*.py' -o -name '*_test.py' | grep -q .; then
            echo "found=true" >> $GITHUB_OUTPUT
            echo "🧪 Test files found."
          else
            echo "found=false" >> $GITHUB_OUTPUT
            echo "ℹ️ No test files found – skipping pytest."
          fi

      - name: Run pytest
        if: steps.has-tests.outputs.found == 'true'
        run: |
          echo "🧪 Running tests with pytest..."
          pytest -v --tb=short \
            --ignore=node_modules \
            --ignore=.venv \
            --ignore=venv

  # ───── Job 5: Import Verification ─────
  backend-import:
    name: Import Verification
    needs: [ backend-format, backend-typecheck, backend-test ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi

      - name: Verify all Python files can be imported
        run: |
          echo "📥 Verifying Python files can be parsed and imported..."
          ERRORS=0
          # Check syntax of all .py files
          find . -name '*.py' \
            -not -path './node_modules/*' \
            -not -path './.venv/*' \
            -not -path './venv/*' \
            -not -path './.git/*' \
            | while read pyfile; do
              python -c "
          import py_compile, sys
          try:
              py_compile.compile('$pyfile', doraise=True)
          except py_compile.PyCompileError as e:
              print(f'❌ {e}')
              sys.exit(1)
          " || ERRORS=$((ERRORS+1))
            done
          if [ "$ERRORS" -gt 0 ]; then
            echo "❌ Some Python files have syntax errors!"
            exit 1
          fi
          echo "✅ All Python files parse successfully."
