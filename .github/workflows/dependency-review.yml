name: 'Dependency Review'

on:
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read
  pull-requests: read

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout Repository'
        uses: actions/checkout@v4
      
      - name: 'Dependency Review'
        uses: actions/dependency-review-action@v4
        with:
          # Optional: fail if a dependency introduces a vulnerability (high or critical)
          fail-on-severity: high
          
          # Optional: fail if a dependency has an incompatible license 
          # (you can configure specific licenses using 'deny-licenses')
          # deny-licenses: GPL-3.0, AGPL-3.0
