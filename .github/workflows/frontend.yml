name: 🌐 Frontend – Node CI

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - '**.js'
      - '**.ts'
      - '**.jsx'
      - '**.tsx'
      - 'package.json'
      - 'package-lock.json'
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - '**.js'
      - '**.ts'
      - '**.jsx'
      - '**.tsx'
      - 'package.json'
      - 'package-lock.json'
      - 'frontend/**'
      - '.github/workflows/frontend.yml'

permissions:
  contents: read

# ─────────────────────────────────────────────
# Pipeline:
#   install → audit/lockfile/secrets
#                ├── lint
#                ├── typecheck
#                ├── test
#                └── build
# ─────────────────────────────────────────────

jobs:
  # ───── Job 1: Install & Core Checks ─────
  frontend-check:
    name: Audit, Lockfile & Secrets
    runs-on: ubuntu-latest
    outputs:
      frontend-dir: ${{ steps.detect.outputs.dir }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"    # 🔒 pinned to LTS – prevents version clash

      - name: Verify Node version
        run: |
          echo "🟢 Node version:"
          node --version
          echo "📦 npm version:"
          npm --version

      - name: Detect frontend directory
        id: detect
        run: |
          if [ -f frontend/package.json ]; then
            echo "dir=frontend" >> $GITHUB_OUTPUT
          elif [ -f package.json ]; then
            echo "dir=." >> $GITHUB_OUTPUT
          else
            echo "dir=none" >> $GITHUB_OUTPUT
            echo "⚠️ No package.json found – skipping frontend checks."
          fi

      - name: Install dependencies (strict lockfile)
        if: steps.detect.outputs.dir != 'none'
        working-directory: ${{ steps.detect.outputs.dir }}
        run: |
          if [ -f package-lock.json ]; then
            echo "🔒 Installing with npm ci (strict lockfile)..."
            npm ci
          else
            echo "⚠️ No lockfile found – falling back to npm install"
            npm install
          fi

      - name: Lockfile consistency check
        if: steps.detect.outputs.dir != 'none'
        working-directory: ${{ steps.detect.outputs.dir }}
        run: |
          echo "🔒 Checking lockfile consistency..."
          if [ -f package-lock.json ]; then
            npm ci --dry-run 2>&1 || {
              echo "❌ package-lock.json is out of sync with package.json!"
              echo "Run 'npm install' locally and commit the updated lockfile."
              exit 1
            }
            echo "✅ Lockfile is consistent."
          else
            echo "⚠️ No package-lock.json found. Consider committing it for reproducible builds."
          fi

      - name: Peer dependency clash check
        if: steps.detect.outputs.dir != 'none'
        working-directory: ${{ steps.detect.outputs.dir }}
        run: |
          echo "🔗 Checking for peer dependency clashes..."
          npm ls --all 2>&1 | grep "ERESOLVE\|peer dep\|invalid" || echo "✅ No peer dependency clashes."

      - name: Duplicate package check
        if: steps.detect.outputs.dir != 'none'
        working-directory: ${{ steps.detect.outputs.dir }}
        run: |
          echo "📦 Checking for duplicate packages..."
          npm dedupe --dry-run 2>&1 || true
          echo "✅ Duplicate check complete."

      - name: Vulnerability audit
        if: steps.detect.outputs.dir != 'none'
        working-directory: ${{ steps.detect.outputs.dir }}
        run: |
          echo "🛡️ Auditing for known vulnerabilities..."
          npm audit --audit-level=high || true

      - name: Check for hardcoded secrets in frontend
        run: |
          echo "🔑 Checking JS/TS files for hardcoded credentials..."
          FOUND=0
          if grep -rEnI --include="*.js" --include="*.ts" --include="*.jsx" --include="*.tsx" \
            '(apiKey|secretKey|password|token|auth_token)\s*[:=]\s*["\x27][A-Za-z0-9+/=_-]{8,}' \
            --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=dist --exclude-dir=build \
            . 2>/dev/null; then
            echo "⚠️  Possible hardcoded credentials found in frontend files!"
            FOUND=1
          fi
          if [ "$FOUND" -eq 1 ]; then
            echo "❌ Use environment variables (REACT_APP_, VITE_, NEXT_PUBLIC_) instead."
            exit 1
          fi
          echo "✅ No hardcoded credentials in frontend files."

  # ───── Job 2: Lint ─────
  frontend-lint:
    name: ESLint
    needs: frontend-check
    if: needs.frontend-check.outputs.frontend-dir != 'none'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: ${{ needs.frontend-check.outputs.frontend-dir }}
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Run ESLint
        working-directory: ${{ needs.frontend-check.outputs.frontend-dir }}
        run: npm run lint --if-present

  # ───── Job 3: TypeScript Check ─────
  frontend-typecheck:
    name: TypeScript Check
    needs: frontend-check
    if: needs.frontend-check.outputs.frontend-dir != 'none'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: ${{ needs.frontend-check.outputs.frontend-dir }}
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Check for TypeScript config
        id: ts-check
        working-directory: ${{ needs.frontend-check.outputs.frontend-dir }}
        run: |
          if [ -f tsconfig.json ]; then
            echo "has_ts=true" >> $GITHUB_OUTPUT
            echo "📘 tsconfig.json found – will run type check."
          else
            echo "has_ts=false" >> $GITHUB_OUTPUT
            echo "ℹ️ No tsconfig.json – skipping TypeScript check."
          fi

      - name: Run tsc --noEmit
        if: steps.ts-check.outputs.has_ts == 'true'
        working-directory: ${{ needs.frontend-check.outputs.frontend-dir }}
        run: |
          echo "🔍 Running TypeScript type check..."
          npx tsc --noEmit

  # ───── Job 4: Tests ─────
  frontend-test:
    name: Unit Tests
    needs: frontend-check
    if: needs.frontend-check.outputs.frontend-dir != 'none'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: ${{ needs.frontend-check.outputs.frontend-dir }}
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Run tests
        working-directory: ${{ needs.frontend-check.outputs.frontend-dir }}
        run: npm test --if-present
        env:
          CI: true    # many test runners use this to avoid interactive mode

  # ───── Job 5: Build Verification ─────
  frontend-build:
    name: Production Build
    needs: [ frontend-check, frontend-lint, frontend-typecheck, frontend-test ]
    if: needs.frontend-check.outputs.frontend-dir != 'none'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: ${{ needs.frontend-check.outputs.frontend-dir }}
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Build project
        working-directory: ${{ needs.frontend-check.outputs.frontend-dir }}
        run: |
          echo "🏗️ Running production build..."
          npm run build --if-present
          echo "✅ Build succeeded."
